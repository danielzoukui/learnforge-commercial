name: LearnForge Commercial CI

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Verify Types & Commercial Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run check

      - name: Run Commercial test suite
        run: npm test
