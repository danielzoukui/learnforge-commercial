<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LearnForge Account</title><style>body{font-family:system-ui;margin:0;background:#f8fafc;color:#111827}main{max-width:520px;margin:auto;padding:48px 20px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px}label{display:block;font-weight:650;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:6px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;background:#111827;color:white;padding:11px 16px;font-weight:700;cursor:pointer}.btn.alt{background:white;color:#111827;border:1px solid #cbd5e1}.muted{color:#64748b}.msg{margin-top:16px;min-height:24px}.hidden{display:none}</style></head><body><main><p><a href="/">← LearnForge</a></p><div class="card"><h1>LearnForge account</h1><p class="muted">Secure hosted account access for commercial LearnForge.</p><label>Email<input id="email" type="email" autocomplete="email"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><div id="signupFields" class="hidden"><label>Name<input id="displayName" autocomplete="name"></label><label>Account type<select id="role"><option value="parent">Family / Parent</option><option value="teacher">Teacher</option></select></label></div><div class="row"><button class="btn" id="signin">Sign in</button><button class="btn alt" id="toggleSignup">Create account</button><button class="btn alt" id="recover">Forgot password</button></div><div id="recoveryBox" class="hidden"><label>New password<input id="newPassword" type="password" autocomplete="new-password" minlength="10"></label><div class="row"><button class="btn" id="updatePassword">Update password</button></div></div><p id="msg" class="msg muted"></p></div></main><script>
const $=s=>document.querySelector(s);let signup=false;
async function ensureCommercialAccount(){try{await call('/commercial-api/account',{displayName:$('#displayName')?.value?.trim()||'',role:$('#role')?.value||'parent'})}catch(e){console.warn('Commercial account sync failed',e)}}
async function adoptRedirectSession(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const access_token=h.get('access_token'),refresh_token=h.get('refresh_token');if(!access_token||!refresh_token)return false;await call('/commercial-api/auth/adopt-session',{access_token,refresh_token,expires_in:Number(h.get('expires_in')||3600)});history.replaceState(null,'',location.pathname+location.search);await ensureCommercialAccount();return true}
async function call(path,body){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
$('#toggleSignup').onclick=()=>{signup=!signup;$('#signupFields').classList.toggle('hidden',!signup);$('#toggleSignup').textContent=signup?'Back to sign in':'Create account';$('#signin').textContent=signup?'Create account':'Sign in'};
$('#signin').onclick=async()=>{const msg=$('#msg');msg.textContent='';try{const email=$('#email').value.trim(),password=$('#password').value;if(signup){const d=await call('/commercial-api/auth/signup',{email,password,displayName:$('#displayName').value.trim(),role:$('#role').value});msg.textContent=d.requiresEmailConfirmation?'Check your email to confirm your LearnForge account.':'Account created. Redirecting…';if(!d.requiresEmailConfirmation){ensureCommercialAccount().catch(()=>{});setTimeout(()=>location.href='/pricing.html',350)}}else{await call('/commercial-api/auth/signin',{email,password});msg.textContent='Signed in. Redirecting…';ensureCommercialAccount().catch(()=>{});setTimeout(()=>location.href='/pricing.html',250)}}catch(e){msg.textContent=e.message||'Authentication failed. Please try again.'}};
$('#recover').onclick=async()=>{const msg=$('#msg');msg.textContent='';try{await call('/commercial-api/auth/recover',{email:$('#email').value.trim()});msg.textContent='If that account exists, a recovery email has been sent.'}catch(e){msg.textContent=e.message}};
$('#updatePassword').onclick=async()=>{const msg=$('#msg');msg.textContent='';try{await call('/commercial-api/auth/update-password',{password:$('#newPassword').value});msg.textContent='Password updated. You can continue to your LearnForge plan.';setTimeout(()=>location.href='/pricing.html',700)}catch(e){msg.textContent=e.message}};
(async()=>{try{const adopted=await adoptRedirectSession();const q=new URLSearchParams(location.search);if(q.get('recovery')==='1')$('#recoveryBox').classList.remove('hidden');const r=await fetch('/commercial-api/auth/session',{credentials:'same-origin'});if(r.ok){const d=await r.json();$('#msg').textContent=adopted?'Email verified. Your secure LearnForge session is active.':`Signed in as ${d.user.email}`}}catch(e){$('#msg').textContent=e.message||'Authentication could not be completed.'}})();
</script></body></html>
